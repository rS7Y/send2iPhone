<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>send2iPhone</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: 'JetBrains Mono', monospace;
      background: #1E1E1E;
      color: #FFFFFF;
      font-size: 12px;
      line-height: 1.6;
      position: relative;
      overflow: hidden;
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 999;
    }

    /* ─── Header ─────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #2A2A2A;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      width: 18px;
      height: 18px;
      border-radius: 2px;
    }

    .header h1 {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: #00FF66;
      box-shadow: 0 0 6px rgba(0, 255, 102, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.offline {
      background: #FF0000;
      box-shadow: 0 0 6px rgba(255, 0, 0, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* ─── Status Bar ─────────────────────────────────────── */
    .status-bar {
      padding: 8px 16px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 1px solid #2A2A2A;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar.online {
      color: #00FF66;
      background: rgba(0, 255, 102, 0.04);
    }

    .status-bar.offline {
      color: #FF0000;
      background: rgba(255, 0, 0, 0.04);
    }

    /* ─── Form Section ───────────────────────────────────── */
    .form-section {
      padding: 16px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #2A2A2A;
      border-radius: 0px;
      background: #262626;
      color: #FFFFFF;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #FF0000;
      box-shadow: inset 0 0 12px rgba(255, 0, 0, 0.08);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .hint {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 6px;
      letter-spacing: 0.02em;
    }

    /* ─── Button ─────────────────────────────────────────── */
    .save-btn {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      border: 1px solid #FF0000;
      border-radius: 0px;
      background: transparent;
      color: #FF0000;
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .save-btn:hover {
      background: #FF0000;
      color: #1E1E1E;
    }

    .save-btn:active {
      background: #990000;
      border-color: #990000;
      color: #FFFFFF;
    }

    .save-btn.saved {
      background: #00FF66;
      border-color: #00FF66;
      color: #1E1E1E;
    }

    /* ─── Divider ────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: #2A2A2A;
      margin: 0;
    }

    /* ─── Footer / Instructions ──────────────────────────── */
    .footer {
      padding: 14px 16px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    .footer strong {
      color: rgba(255, 255, 255, 0.6);
      font-weight: 700;
    }

    .footer code {
      background: #262626;
      border: 1px solid #2A2A2A;
      padding: 1px 5px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255, 255, 255, 0.5);
    }

    .footer .action-hint {
      margin-top: 8px;
      padding: 6px 10px;
      background: rgba(255, 0, 0, 0.06);
      border-left: 3px solid #FF0000;
      color: rgba(255, 255, 255, 0.5);
      font-size: 10px;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img src="icon-16.png" class="header-icon" alt="">
      <h1>send2iPhone</h1>
    </div>
    <div class="status-dot offline" id="statusDot"></div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar offline" id="statusBar">
    <span>● checking bridge…</span>
  </div>

  <!-- Form -->
  <div class="form-section">
    <label for="recipient">recipient</label>
    <input type="text" id="recipient" placeholder="+91 9021 639 892" spellcheck="false" autocomplete="off">
    <div class="hint">iMessage phone number or Apple ID email</div>

    <button class="save-btn" id="saveBtn">SAVE →</button>
  </div>

  <div class="divider"></div>

  <!-- Footer -->
  <div class="footer">
    <strong>Usage:</strong> Right-click any image → <strong>📱 Send to iPhone</strong>
    <div class="action-hint">
      Bridge must be running: <code>node server.js</code>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
